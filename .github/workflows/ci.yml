name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint lint --strict --config .swiftlint.yml
      - name: Build app and tests
        run: |
          xcodebuild build-for-testing \
            -project LiveStockTracker.xcodeproj \
            -scheme LiveStockTracker \
            -destination "generic/platform=iOS Simulator"
